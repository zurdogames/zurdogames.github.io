<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zurdo Games</title><meta name="description" content="Zurdo Games makes small, cozy games for phones.">
<style>
:root{--bg:#fbf6ee;--panel:#fff;--ink:#2d2620;--ink-2:#6b5f55;--line:#e8dccb;--accent:#c4612b}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--panel:#26211d;--ink:#f1e9df;--ink-2:#b8aa9b;--line:#3a322b;--accent:#f0a06c}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
header.site{max-width:720px;margin:0 auto;padding:20px 16px 0;font-weight:800;letter-spacing:.02em}
header.site a{color:var(--ink);text-decoration:none}
h1{font-size:30px;line-height:1.2;margin:8px 0 4px}h2{font-size:20px;margin:32px 0 6px}
a{color:var(--accent);overflow-wrap:anywhere}p,li{color:var(--ink)}em,.muted{color:var(--ink-2)}
ul{padding-left:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:12px 0}
.card h2{margin:0 0 4px}.card p{margin:4px 0}
footer{max-width:720px;margin:0 auto;padding:0 16px 40px;color:var(--ink-2);font-size:14px}
</style></head><body>
<header class="site"><a href="./">Zurdo Games</a></header>
<main>
<h1>Zurdo Games</h1>
<p class="muted">Small, cozy games for phones.</p>
<div class="card">
  <h2>Paws in Place</h2>
  <p>Cozy pet logic puzzles. Solve a little, build a home. Coming soon to Google Play.</p>
  <p><a href="paws-in-place/privacy/">Privacy policy</a></p>
</div>
<h2>Contact</h2>
<p>Questions or support: <a href="mailto:sivareno12@gmail.com">sivareno12@gmail.com</a></p>
</main>
<footer>© 2026 Zurdo Games · <a href="mailto:sivareno12@gmail.com">sivareno12@gmail.com</a></footer>
</body></html>
